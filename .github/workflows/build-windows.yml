name: Build-Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      package:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            .vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', '.github/workflows/build-windows.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          # AI-generated: Retry transient dependency downloads.
          $arguments = @(
            '-B', 'build',
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake',
            '-DVCPKG_TARGET_TRIPLET=x64-windows-release',
            '-DVCPKG_BUILD_TYPE=release',
            '-DBUILD_TESTING=OFF',
            '-DCUBED_VERSION=${{ inputs.version }}'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & cmake @arguments
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              Write-Warning "Configure attempt $attempt failed; retrying in 15 seconds."
              Start-Sleep -Seconds 15
            }
          }

          exit $LASTEXITCODE

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vcpkg-failure-logs
          path: |
            build/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/issue_body.md
            vcpkg/buildtrees/**/*.log
          if-no-files-found: warn

      - name: Build
        run: cmake --build build --config Release --target Cubed

      - name: Copy assets
        if: inputs.package
        shell: pwsh
        run: |
          if (Test-Path assets) {
            Copy-Item -Path assets -Destination build/Cubed -Recurse
          } else {
            Write-Warning "assets folder not found, skipping copy"
          }

      - name: Create Zip
        if: inputs.package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/Cubed/* `
            -DestinationPath Cubed-${{ inputs.version }}-windows-x64.zip

      - name: Upload Windows Artifact
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Cubed-${{ inputs.version }}-windows-x64.zip

