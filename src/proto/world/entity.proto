edition = "2024";

package cubed.protocol;

import "common/vector3.proto";

message S2CEntityCreate {
    uint64 id = 1;
    string name = 2;
    common.Vec3 pos = 3;
}

message S2CEntityDestroy {
    uint64 id = 1;
}

message S2CEntityUpdate {
    uint64 id = 1;
    common.Vec3 pos = 2;
    common.Vec3 direction = 3;
    int32 gait = 4;
}

message S2CEntityUpdateBatch {
    repeated S2CEntityUpdate updates = 1;
}