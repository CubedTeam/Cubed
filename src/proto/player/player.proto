edition = "2024";

package cubed.protocol;

import "common/vector3.proto";

message C2SPlayerInfo {
    bytes uuid = 1;
    common.Vec3 pos = 2;
    float yaw = 3;
    float pitch = 4;
    int32 gait = 5;
}

message PlayerInfoRsp {
    bytes uuid = 1;
    string name = 2;
    common.Vec3 pos = 3;
    float yaw = 4;
    float pitch = 5;
    int32 gait = 6;
}

message PlayerWaterSound {
    bytes uuid = 1;
    common.Vec3 pos = 2;
    bool underwater = 3;
}