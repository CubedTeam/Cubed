name: Release-Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: false
        default: dev

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            

    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
    steps:

      - uses: actions/checkout@v4


      - name: Get Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-cache
            .vcpkg-downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', '.github/workflows/release-build.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.bat
      
      - name: Configure
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # AI-generated: Retry transient dependency downloads.
          $arguments = @(
            '-B', 'build',
            '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake',
            '-DVCPKG_TARGET_TRIPLET=x64-windows-release',
            '-DVCPKG_BUILD_TYPE=release',
            '-DBUILD_TESTING=OFF',
            '-DCUBED_VERSION=${{ steps.version.outputs.version }}'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            & cmake @arguments
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              Write-Warning "Configure attempt $attempt failed; retrying in 15 seconds."
              Start-Sleep -Seconds 15
            }
          }

          exit $LASTEXITCODE

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-failure-logs
          path: |
            build/vcpkg-manifest-install.log
            vcpkg/buildtrees/**/issue_body.md
            vcpkg/buildtrees/**/*.log
          if-no-files-found: warn

      - name: Build
        run: cmake --build build --config Release --target Cubed

      - name: Copy assets
        if: matrix.platform == 'windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          if (Test-Path assets) {
            Copy-Item -Path assets -Destination build/Cubed -Recurse
          } else {
            Write-Warning "assets folder not found, skipping copy"
          }

      - name: Create Zip
        if: matrix.platform == 'windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/Cubed/* `
            -DestinationPath Cubed-${{ steps.version.outputs.version }}-windows-x64.zip
      
      ####################################################################
      # Upload
      ####################################################################

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            *.zip

  ##########################################################################
  # Release
  ##########################################################################

  release:

    needs: build
    if: github.ref_type == 'tag'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256
        run: |
          cd artifacts

          find . -type f | while read file
          do
            sha256sum "$file"
          done > SHA256SUMS
          
      - name: Determine prerelease
        id: prerelease
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          # AI-generated: Stable semantic versions create full releases.
          if [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "is_prerelease=false"
          else
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "is_prerelease=true"
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
