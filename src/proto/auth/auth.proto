syntax = "proto3";

message LoginReq {
    bytes public_key = 1;
    bytes uuid = 2;
}

message LoginChallenge {
    bytes challenge = 1;
    bytes uuid = 2;
}

message LoginProof {
    bytes signature = 1; 
    bytes uuid = 2;
    string name = 3;
}

message LoginRsp {
    int32 ec = 1;
    bool voice_chat = 2;
}

message LogoutReq {
    string uuid = 1;
}

message LogoutRsp {
    string uuid = 1;
    bool server_stop = 2;
}

