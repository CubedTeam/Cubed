name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: false
        default: dev

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Get Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version || 'dev' }}"
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: get-version
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      package: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

  build-linux:
    needs: get-version
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      package: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

  release:
    runs-on: ubuntu-latest
    needs: [get-version, build-windows, build-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: artifacts

      - name: Generate SHA256
        run: |
          cd artifacts
          sha256sum Cubed-* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/Cubed-*
            artifacts/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.get-version.outputs.prerelease == 'true' }}
